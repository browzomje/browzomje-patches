name: Feature request
description: Suggest a specific new patch or setting.
title: 'feat: '
body:
- type: markdown
  attributes:
    value: Search open and closed issues first. Check the supported Pinterest version and patch releases in [the
      README](https://github.com/browzomje/browzomje-patches#readme). Copy exact version numbers, including any
      -dev suffix; do not write “latest”. Never attach account credentials, tokens, or private content.
- type: input
  id: app_version
  attributes:
    label: App and exact version
    description: 'For example: Pinterest 14.39.0. Find it in Android app info or the Morphe settings screen.'
  validations:
    required: true
- type: input
  id: patches_version
  attributes:
    label: Exact browzomje patches version
    description: Copy the full bundle version from Morphe settings or the selected patch source, including -dev.N
      if present.
  validations:
    required: true
- type: textarea
  id: feature
  attributes:
    label: Requested behavior
    description: Describe exactly what should change, where in the app, and how it should work.
  validations:
    required: true
- type: textarea
  id: use_case
  attributes:
    label: Use case and motivation
    description: Describe the problem this solves and a concrete example.
  validations:
    required: true
- type: textarea
  id: current
  attributes:
    label: Current behavior and relevant settings
    description: What happens on your version? Which existing patch/settings have you tried?
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives and examples
    description: Other approaches, screenshots, recordings or public example Pin links. Avoid private boards.
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: Before submitting
    options:
    - label: I searched open and closed issues for duplicates.
      required: true
    - label: I provided exact versions and removed private information from attachments.
      required: true
