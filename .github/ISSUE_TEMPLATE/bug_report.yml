name: Bug report
description: Report incorrect behavior in the patched app.
title: 'bug: '
body:
- type: markdown
  attributes:
    value: Search open and closed issues first. Check the supported Pinterest version and patch releases in [the
      README](https://github.com/browzomje/browzomje-patches#readme). Copy exact version numbers, including any
      -dev suffix; do not write “latest”. Never attach account credentials, tokens, or private content.
- type: input
  id: app_version
  attributes:
    label: App and exact version
    description: 'For example: Pinterest 14.39.0. Find it in Android app info or the Morphe settings screen.'
  validations:
    required: true
- type: input
  id: patches_version
  attributes:
    label: Exact browzomje patches version
    description: Copy the full bundle version from Morphe settings or the selected patch source, including -dev.N
      if present.
  validations:
    required: true
- type: input
  id: device
  attributes:
    label: Device and Android version
    description: Device model, Android version, and custom ROM if applicable.
  validations:
    required: true
- type: input
  id: patcher
  attributes:
    label: Patching tool and version
    description: Morphe Manager / CLI version; mention other patch sources used.
  validations:
    required: true
- type: textarea
  id: settings
  attributes:
    label: Relevant patches and settings
    description: List enabled patches and relevant Morphe toggles, or attach a settings export after reviewing it.
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: 'Numbered steps from opening the app. Include where this happens: Home, search, board, Pin, etc.'
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: What should happen?
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: What happens instead? How often?
  validations:
    required: true
- type: textarea
  id: regression
  attributes:
    label: Comparison and last working version
    description: Does the unpatched app behave the same? Last working app/patch version, if known. Write “not tested”
      when unknown.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs and screenshots
    description: Attach relevant logs, screenshots or a short recording. Remove private data. Do not paste an entire
      unrelated log.
  validations:
    required: false
- type: checkboxes
  id: checks
  attributes:
    label: Before submitting
    options:
    - label: I searched open and closed issues for duplicates.
      required: true
    - label: I provided exact versions and removed private information from attachments.
      required: true
