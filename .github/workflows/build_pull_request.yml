name: Build pull request

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pinterest JVM regressions
        run: |
          python3 -m venv "$RUNNER_TEMP/pinterest-tests"
          "$RUNNER_TEMP/pinterest-tests/bin/python" -m pip install Pillow
          export PINTEREST_JSON_JAR="$RUNNER_TEMP/pinterest-tests/json.jar"
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar \
            --output "$PINTEREST_JSON_JAR"
          for test in tests/pinterest/test_*.py; do
            "$RUNNER_TEMP/pinterest-tests/bin/python" "$test"
          done

      - name: Cache Gradle
        uses: burrunan/gradle-cache-action@v3

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
